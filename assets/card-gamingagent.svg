<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-label="GamingAgent — Agentic AI · human-in-the-loop">
<title>GamingAgent</title>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <radialGradient id="halo" cx="85%" cy="20%" r="60%"><stop offset="0" stop-color="#f472b6" stop-opacity="0.28"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="c"><rect width="600" height="250" rx="18"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="600" height="250" fill="#0b1020"/>
  <rect width="600" height="250" fill="url(#halo)"/>
  <g>
  <path id="loop" d="M470,60 L560,100 L520,170 L430,140 Z" fill="none" stroke="#f472b6" stroke-opacity="0.35" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1s" repeatCount="indefinite"/></path>
  <circle cx="470" cy="60" r="20" fill="#111827" stroke="#f472b6" stroke-width="1.5"/><text x="470" y="64" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#e2e8f0">plan</text><circle cx="560" cy="100" r="20" fill="#111827" stroke="#f472b6" stroke-width="1.5"/><text x="560" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#e2e8f0">code</text><circle cx="520" cy="170" r="20" fill="#111827" stroke="#f472b6" stroke-width="1.5"/><text x="520" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#e2e8f0">run</text><circle cx="430" cy="140" r="20" fill="#111827" stroke="#f472b6" stroke-width="1.5"/><text x="430" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#e2e8f0">fix</text>
  <circle r="6" fill="#f472b6" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion></circle>
  <text x="495" y="215" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#64748b">human approves ✓</text>
</g>
  <text x="28" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2" fill="#f472b6">AGENTIC AI · HUMAN-IN-THE-LOOP</text>
  <text x="28" y="84" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" fill="#f8fafc">GamingAgent</text>
  <text x="28" y="120" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#cbd5e1">Plans, codes, runs &amp; repairs browser games</text><text x="28" y="142" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#cbd5e1">from one prompt — Ollama planner, Groq coder,</text><text x="28" y="164" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#cbd5e1">Playwright verification, MCP email tool.</text>
  <rect x="28" y="196" width="66" height="26" rx="13" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.5"/><text x="61" y="213.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#f472b6">Python</text><rect x="102" y="196" width="66" height="26" rx="13" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.5"/><text x="136" y="213.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#f472b6">Ollama</text><rect x="177" y="196" width="52" height="26" rx="13" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.5"/><text x="203" y="213.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#f472b6">Groq</text><rect x="236" y="196" width="44" height="26" rx="13" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.5"/><text x="258" y="213.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#f472b6">MCP</text>
</g>
<rect x="1" y="1" width="598" height="248" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5"/>
<rect x="1" y="1" width="598" height="248" rx="17" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="90 1600" stroke-linecap="round" filter="url(#glow)">
  <animate attributeName="stroke-dashoffset" values="0;-1690" dur="6s" repeatCount="indefinite"/>
</rect>
</svg>